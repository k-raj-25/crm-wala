# Render Blueprint - New > Blueprint > pick this repo. Full walkthrough: docs/DEPLOY_RENDER.md
#
# Topology:   browser -> crm-web / crm-admin (Next.js, public) --private network--> crm-api (Flask, PRIVATE)
#                                                                                   |-> crm-db (Postgres), crm-redis, crm-worker (Celery + beat)
# The API has no public URL on purpose: Stripe/Razorpay webhooks, OAuth callbacks and public lead forms all arrive through
# crm-web's domain (/api/* is proxied), and the admin API is only reachable through crm-admin.

databases:
  - name: crm-db
    plan: basic-256mb          # free Postgres expires after 30 days - not suitable for real data
    postgresMajorVersion: "16"
    ipAllowList: []            # private network only. Add {source: <your-ip>/32, description: me} if you need psql from your laptop.

services:
  - type: keyvalue
    name: crm-redis
    plan: free
    maxmemoryPolicy: noeviction   # Celery broker: never silently drop queued jobs
    ipAllowList: []

  - type: pserv
    name: crm-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Idempotent: applies migrations, then creates any missing plans/roles/flags/templates (never overwrites admin edits).
    startCommand: flask db upgrade && flask seed-platform && gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - fromGroup: crm-shared
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_APP
        value: wsgi.py
      - key: WEB_CONCURRENCY
        value: "2"

  - type: worker
    name: crm-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # -B embeds the scheduler (billing lifecycle, reminders, automation resumes, scheduled emails/reports). Keep exactly ONE instance.
    startCommand: celery -A app.celery_app.celery worker -B -l info -c 2 -s /tmp/celerybeat-schedule
    envVars:
      - fromGroup: crm-shared
      - key: PYTHON_VERSION
        value: 3.12.8

  - type: web
    name: crm-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @crm/web
    startCommand: npm run start -w @crm/web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL            # host:port of the private API; next.config.ts adds http://
        fromService: { type: pserv, name: crm-api, property: hostport }

  - type: web
    name: crm-admin
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w @crm/admin
    startCommand: npm run start -w @crm/admin
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        fromService: { type: pserv, name: crm-api, property: hostport }

envVarGroups:
  - name: crm-shared               # identical values for the API and the worker
    envVars:
      - key: APP_ENV
        value: staging             # switch to "production" once real billing/email/storage are configured (see docs)
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY      # Fernet key - generate it yourself, see docs/DEPLOY_RENDER.md step 1
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: crm-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: crm-redis, property: connectionString }
      - key: WEB_ORIGIN          # public URLs, e.g. https://crm-web.onrender.com - set after the first deploy if Render renamed them
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_REQUIRE_2FA
        value: "true"
      - key: TRUSTED_PROXY_HOPS   # Render LB + Next.js proxy in front of the API: needed so rate limits use real client IPs
        value: "2"
      - key: LOG_FORMAT
        value: json
      - key: BILLING_PROVIDER     # mock = test checkout, no real charges. Use stripe or razorpay (+ keys) for production.
        value: mock
      - key: EMAIL_PROVIDER       # console = prints emails to the log. Use resend or smtp (+ keys) to really send.
        value: console
      - key: STORAGE_BACKEND      # local disk is wiped on every deploy. Use s3 (+ S3_* vars) for real uploads.
        value: local
