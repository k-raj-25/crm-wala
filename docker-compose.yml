# One-command local stack:  docker compose up --build
# Web http://localhost:3000 · Admin http://localhost:3001 · API http://localhost:5000 · MinIO console http://localhost:9001
# Demo data:  docker compose exec api flask seed-demo --reset && docker compose exec api flask seed-sample
# First admin: docker compose exec api flask admin create --email you@company.com --name "You"
x-api-env: &api-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://crm_app:crm_app_dev@postgres:5432/crm
  REDIS_URL: redis://redis:6379/0
  WEB_ORIGIN: http://localhost:3000
  ADMIN_ORIGIN: http://localhost:3001
  API_ORIGIN: http://localhost:5000
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Y3JtLXdhbGEtZGV2LW9ubHktZW5jcnlwdGlvbi1rZXk=}
  ADMIN_REQUIRE_2FA: "true"
  STORAGE_BACKEND: s3
  S3_BUCKET: crm-files
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: ["sh", "-c", "sleep 3 && mc alias set l http://minio:9000 minioadmin minioadmin && mc mb -p l/crm-files"]
  migrate:
    build: ./backend
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy } }
    command: ["sh", "-c", "flask db upgrade && flask seed-platform"]
  api:
    build: ./backend
    environment: *api-env
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    ports: ["5000:5000"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/healthz')"], interval: 10s, retries: 5 }
  worker:
    build: ./backend
    environment: *api-env
    depends_on: [api]
    command: ["celery", "-A", "app.celery_app.celery", "worker", "-l", "info", "-c", "2"]
  beat:
    build: ./backend
    environment: *api-env
    depends_on: [api]
    command: ["celery", "-A", "app.celery_app.celery", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
  web:
    build: { context: ., dockerfile: deploy/node.Dockerfile, args: { APP: web, API_URL: "http://api:5000" } }
    depends_on: [api]
    ports: ["3000:3000"]
  admin:
    build: { context: ., dockerfile: deploy/node.Dockerfile, args: { APP: admin, API_URL: "http://api:5000" } }
    depends_on: [api]
    ports: ["3001:3001"]

volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
